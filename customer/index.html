<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f6f7fb" />
  <title>STARLINK · 企业音乐工作台</title>
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="./ui-review.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand-row">
        <a class="brand" href="#/home" aria-label="STARLINK 首页">
          <span class="brand-mark">S</span>
          <span class="brand-copy"><strong>STARLINK</strong><small>企业音乐工作台</small></span>
        </a>
        <button class="icon-btn sidebar-toggle" id="sidebarToggle" aria-label="收起侧边栏" title="收起侧边栏" data-icon="panel-left"></button>
      </div>

      <!-- 保留不可见挂载点兼容现有 Demo 脚本；前台不再提供组织/账号切换入口。 -->
      <span id="workspaceSwitch" hidden aria-hidden="true"></span>

      <nav class="side-nav" id="sideNav" aria-label="主导航"></nav>

      <div class="sidebar-bottom">
        <button class="support-card" data-route="developer">
          <span class="support-icon" data-icon="sparkles"></span>
          <span><strong>需要帮助？</strong><small>查看接入文档与支持</small></span>
          <span data-icon="arrow-up-right"></span>
        </button>
        <div class="account-card">
          <span class="avatar">KH</span>
          <span class="account-meta"><strong>客户管理员</strong><small>admin@kanjian.com</small></span>
          <button class="icon-btn" title="账户设置" data-route="settings" data-icon="ellipsis"></button>
        </div>
      </div>
    </aside>

    <section class="main-shell">
      <header class="topbar">
        <div class="mobile-brand">
          <button class="icon-btn" id="mobileMenu" aria-label="打开菜单" data-icon="menu"></button>
          <span class="brand-mark">S</span>
        </div>
        <button class="project-switch" id="projectSwitch">
          <span class="project-icon" data-icon="briefcase-business"></span>
          <span class="project-copy"><small>当前项目</small><strong>Keep App · 2026 Q4</strong></span>
          <span data-icon="chevron-down"></span>
        </button>
        <div class="global-search" id="globalSearch">
          <span data-icon="search"></span>
          <input id="globalSearchInput" autocomplete="off" placeholder="搜索歌曲、艺人、ISRC，或描述你想要的音乐" />
          <kbd>⌘ K</kbd>
        </div>
        <div class="top-actions">
          <button class="top-action ai-entry" data-route="ai"><span data-icon="sparkles"></span><span>AI 找歌</span></button>
          <button class="icon-btn has-dot" title="通知" data-icon="bell"></button>
          <button class="icon-btn" title="帮助" data-icon="circle-help"></button>
        </div>
      </header>

      <main class="workspace" id="workspace" tabindex="-1"></main>
    </section>
  </div>

  <div class="scrim" id="scrim"></div>
  <div class="toast-stack" id="toastStack" aria-live="polite"></div>

  <template id="dropdownTemplate">
    <div class="dropdown-panel"></div>
  </template>

  <script src="./app.js"></script>
</body>
</html>
