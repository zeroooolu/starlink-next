<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>STARLINK Next · Demo</title>
  <style>
    :root{--blue:#2f49ff;--ink:#16181d;--muted:#6f7480;--line:#e8eaf0;--bg:#f6f7fb}
    *{box-sizing:border-box} body{margin:0;font-family:Inter,"PingFang SC","Microsoft YaHei",Arial,sans-serif;background:var(--bg);color:var(--ink)}
    .wrap{min-height:100vh;display:grid;place-items:center;padding:48px}.panel{width:min(980px,100%)}
    .brand{font-size:14px;color:var(--blue);font-weight:800;letter-spacing:.08em}.title{font-size:40px;line-height:1.2;margin:14px 0 10px}.sub{color:var(--muted);font-size:16px;margin-bottom:32px}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.card{display:block;background:#fff;border:1px solid var(--line);border-radius:18px;padding:28px;text-decoration:none;color:inherit;transition:.2s ease;box-shadow:0 8px 30px rgba(22,24,29,.04)}
    .card:hover{transform:translateY(-3px);border-color:#cbd1ff;box-shadow:0 16px 42px rgba(47,73,255,.1)}.tag{display:inline-flex;padding:6px 10px;border-radius:999px;background:#eef0ff;color:var(--blue);font-size:12px;font-weight:700}.card h2{margin:22px 0 8px;font-size:24px}.card p{margin:0;color:var(--muted);line-height:1.7}.go{display:inline-flex;margin-top:24px;color:var(--blue);font-weight:700}
    @media(max-width:720px){.grid{grid-template-columns:1fr}.title{font-size:32px}.wrap{padding:24px}}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="panel">
      <div class="brand">KANJIAN · STARLINK NEXT</div>
      <h1 class="title">统一曲库访问与运营平台</h1>
      <div class="sub">首版 Demo 先拆成两个产品：内部曲库工作台与外部客户平台。</div>
      <div class="grid">
        <a class="card" href="./internal/">
          <span class="tag">INTERNAL</span>
          <h2>内部曲库工作台</h2>
          <p>面向曲库运营、商务与版权人员，聚焦曲库检索、分析、资产准备、客户与交付，并提供 AI Agent 统一入口。</p>
          <span class="go">进入 Demo →</span>
        </a>
        <a class="card" href="./customer/">
          <span class="tag">CUSTOMER</span>
          <h2>STARLINK 客户平台</h2>
          <p>面向授权客户开放可用曲库，让客户自己搜索、试听、选歌、管理自己的曲库并通过下载或 API 获取内容。</p>
          <span class="go">进入 Demo →</span>
        </a>
      </div>
    </section>
  </main>
</body>
</html>
