<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>STARLINK 内部曲库工作台</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="logo">STARLINK <span class="logo-badge">INTERNAL</span></div>

    <button class="nav-item top active" data-route="dashboard">
      <span>⌂</span><span>工作台</span>
    </button>

    <div class="nav-section">内容</div>
    <div class="nav-group-label"><span>♫</span><span>曲库</span></div>
    <div class="nav-sub">
      <button class="nav-item" data-route="catalog-search">曲库检索</button>
      <button class="nav-item" data-route="catalog-dashboard">曲库看板</button>
      <button class="nav-item" data-route="tags">标签管理</button>
    </div>

    <div class="nav-group-label" style="margin-top:6px"><span>≡</span><span>歌单与交付</span></div>
    <div class="nav-sub">
      <button class="nav-item" data-route="playlists">歌单管理</button>
      <button class="nav-item" data-route="categories">分类管理</button>
      <button class="nav-item" data-route="deliveries">交付记录</button>
    </div>

    <div class="nav-section">业务</div>
    <div class="nav-group-label"><span>◎</span><span>客户</span></div>
    <div class="nav-sub">
      <button class="nav-item" data-route="customers">客户管理</button>
      <button class="nav-item" data-route="projects">项目管理</button>
      <button class="nav-item" data-route="requirements">需求管理</button>
    </div>

    <button class="nav-item top agent" data-route="agent"><span>✦</span><span>AI Agent</span></button>

    <div class="nav-section">管理</div>
    <button class="nav-item top" data-route="settings"><span>⚙</span><span>系统设置</span></button>

    <div class="sidebar-footer">
      外部客户平台暂保留现有 Demo<br><a href="../customer/">查看 STARLINK 客户端 →</a>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="breadcrumb" id="breadcrumb"><b>工作台</b></div>
      <div class="global-agent">
        <span class="spark">✦</span>
        <input placeholder="问曲库：例如“找 30 首适合影石无人机旅行视频的全球可用音乐”" />
        <button data-route="agent">询问 Agent</button>
      </div>
      <div class="avatar">环</div>
    </header>

    <section class="content" id="workspace"></section>
  </main>
</div>

<div class="drawer-mask" id="drawerMask">
  <aside class="drawer" id="drawerContent"></aside>
</div>

<script src="./app.js"></script>
<script src="./dashboard.js"></script>
</body>
</html>
