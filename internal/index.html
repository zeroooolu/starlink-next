<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>STARLINK 内部曲库工作台</title>
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="./shell.css" />
  <link rel="stylesheet" href="./catalog-search.css" />
  <link rel="stylesheet" href="./category-management.css" />
  <link rel="stylesheet" href="./playlist-management.css" />
  <link rel="stylesheet" href="./smart-playlist.css" />
  <link rel="stylesheet" href="./delivery-management.css" />
  <link rel="stylesheet" href="./customer-management.css" />
  <link rel="stylesheet" href="./customer-detail.css" />
  <link rel="stylesheet" href="./customer-api-demo.css" />
  <link rel="stylesheet" href="./workflow-management.css" />
  <link rel="stylesheet" href="./customer-workflow-tabs.css" />
  <link rel="stylesheet" href="./detail-breadcrumb.css" />
  <link rel="stylesheet" href="./customer-detail-actions.css" />
  <link rel="stylesheet" href="./customer-catalog-management.css" />
  <link rel="stylesheet" href="./customer-create-actions.css" />
  <link rel="stylesheet" href="./agent-workspace.css" />
  <link rel="stylesheet" href="./admin-polish.css" />
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="logo">
      <div class="brand-mark">S</div>
      <div class="logo-copy">
        <strong>STARLINK</strong>
        <span>曲库工作台</span>
      </div>
    </div>

    <button class="nav-item top active" data-route="dashboard">
      <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.8 12 3l9 7.8"/><path d="M5.5 9.5V21h13V9.5"/><path d="M9.5 21v-6h5v6"/></svg>
      <span>工作台</span>
    </button>

    <div class="nav-section">内容</div>
    <div class="nav-group-label">
      <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg>
      <span>曲库</span>
    </div>
    <div class="nav-sub">
      <button class="nav-item" data-route="catalog-search">曲库检索</button>
      <button class="nav-item" data-route="catalog-dashboard">曲库看板</button>
      <button class="nav-item" data-route="tags">标签管理</button>
    </div>

    <div class="nav-group-label" style="margin-top:4px">
      <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6h.01M4 12h.01M4 18h.01"/></svg>
      <span>歌单与交付</span>
    </div>
    <div class="nav-sub">
      <button class="nav-item" data-route="playlists">歌单管理</button>
      <button class="nav-item" data-route="categories">分类管理</button>
      <button class="nav-item" data-route="deliveries">交付记录</button>
    </div>

    <div class="nav-section">业务</div>
    <div class="nav-group-label">
      <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      <span>客户</span>
    </div>
    <div class="nav-sub">
      <button class="nav-item" data-route="customers">客户管理</button>
      <button class="nav-item" data-route="projects">项目管理</button>
      <button class="nav-item" data-route="requirements">需求管理</button>
    </div>

    <button class="nav-item top agent" data-route="agent">
      <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3-1.15 3.1A6 6 0 0 1 7.1 9.85L4 11l3.1 1.15a6 6 0 0 1 3.75 3.75L12 19l1.15-3.1a6 6 0 0 1 3.75-3.75L20 11l-3.1-1.15a6 6 0 0 1-3.75-3.75L12 3Z"/><path d="m19 3-.45 1.2A2.8 2.8 0 0 1 16.8 5.95L15.6 6.4l1.2.45a2.8 2.8 0 0 1 1.75 1.75L19 9.8l.45-1.2a2.8 2.8 0 0 1 1.75-1.75l1.2-.45-1.2-.45a2.8 2.8 0 0 1-1.75-1.75L19 3Z"/></svg>
      <span>AI Agent</span>
    </button>

    <div class="nav-section">管理</div>
    <button class="nav-item top" data-route="settings">
      <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.83 2.83-.06-.06a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-1.03 1.56V21h-4v-.08A1.7 1.7 0 0 0 8.97 19.4a1.7 1.7 0 0 0-1.88.34l-.06.06-2.83-2.83.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.52-1.03H3v-4h.08A1.7 1.7 0 0 0 4.6 8.94a1.7 1.7 0 0 0-.34-1.88L4.2 7l2.83-2.83.06.06a1.7 1.7 0 0 0 1.88.34A1.7 1.7 0 0 0 10 3.05V3h4v.05a1.7 1.7 0 0 0 1.03 1.52 1.7 1.7 0 0 0 1.88-.34l.06-.06L19.8 7l-.06.06a1.7 1.7 0 0 0-.34 1.88A1.7 1.7 0 0 0 20.92 10H21v4h-.08A1.7 1.7 0 0 0 19.4 15Z"/></svg>
      <span>系统设置</span>
    </button>

    <div class="sidebar-footer">
      <a class="platform-switch" href="../customer/">
        <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/></svg>
        <span>切换到客户平台</span>
        <svg class="switch-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
      </a>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="breadcrumb" id="breadcrumb"><b>工作台</b></div>
      <div class="global-agent">
        <span class="spark">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3-1.15 3.1A6 6 0 0 1 7.1 9.85L4 11l3.1 1.15a6 6 0 0 1 3.75 3.75L12 19l1.15-3.1a6 6 0 0 1 3.75-3.75L20 11l-3.1-1.15a6 6 0 0 1-3.75-3.75L12 3Z"/></svg>
        </span>
        <input placeholder="问曲库：搜索内容、分析曲库或处理客户需求" />
        <button data-route="agent">询问 Agent</button>
      </div>
      <div class="user-menu">
        <div class="avatar">环</div>
        <div class="user-copy"><strong>环环</strong><span>内部账号</span></div>
        <svg class="user-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m7 10 5 5 5-5"/></svg>
      </div>
    </header>

    <section class="content" id="workspace"></section>
  </main>
</div>

<div class="drawer-mask" id="drawerMask">
  <aside class="drawer" id="drawerContent"></aside>
</div>

<script src="./app.js"></script>
<script src="./dashboard.js"></script>
<script src="./catalog-search.js"></script>
<script src="./category-management.js"></script>
<script src="./playlist-management.js"></script>
<script src="./smart-playlist.js"></script>
<script src="./delivery-management.js"></script>
<script src="./customer-management.js"></script>
<script src="./customer-detail.js"></script>
<script src="./workflow-management.js"></script>
<script src="./customer-workflow-tabs.js"></script>
<script src="./detail-breadcrumb.js"></script>
<script src="./customer-detail-actions.js"></script>
<script src="./customer-detail-controls.js"></script>
<script src="./customer-catalog-management.js"></script>
<script src="./customer-create-actions.js"></script>
<script src="./agent-workspace.js"></script>
<script src="./customer-api-demo.js"></script>
</body>
</html>
